<mat-card class="register-form">
  <mat-card-header>
    <mat-card-title>Register</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Vorname</mat-label>
        <input matInput id="firstName" type="text" formControlName="firstName" autocomplete="given-name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nachname</mat-label>
        <input matInput id="lastName" type="text" formControlName="lastName" autocomplete="family-name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput id="email" type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput id="password" type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirm password</mat-label>
        <input
          matInput
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        @if (form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched) {
          <mat-error>Passwords do not match.</mat-error>
        }
      </mat-form-field>

      <button mat-flat-button type="submit">Register</button>
    </form>
  </mat-card-content>
</mat-card>
