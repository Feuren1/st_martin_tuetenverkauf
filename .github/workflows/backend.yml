name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        run: ./mvnw test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: prep
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/tuetenverkauf:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/tuetenverkauf:${{ github.sha }}

  smoke-test:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      COMPOSE_FILE: docker-compose.prod.yml

    defaults:
      run:
        working-directory: backend/docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dummy secrets
        run: |
          mkdir -p secrets
          printf '%s' 'testpassword' > secrets/DB_PASSWORD
          printf '%s' 'jG5p/CohZPbAo+/84x8XR8nz8wf3NuPqfQGPbf7PiP4rrftsMmQCyH34v06/Y8Hs' > secrets/JWT_SECRET

      # Requires a healthcheck on the backend service, otherwise --wait
      # only waits for postgres and the job goes green on a crash-looping app.
      - name: Start stack and wait for health
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose up -d --wait --wait-timeout 180

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        env:
          DEPLOY_KEY: ${{ secrets.ST_MARTIN_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          BACKEND_IMAGE_TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env BACKEND_IMAGE_TAG='$BACKEND_IMAGE_TAG' /usr/local/sbin/stmartin-deploy-backend"